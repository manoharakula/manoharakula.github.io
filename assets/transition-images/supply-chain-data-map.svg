<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Supply chain data map</title>
  <desc id="desc">Original abstract transition background showing logistics nodes, routes, and analytics signals.</desc>
  <defs>
